<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIIN · Demo interactiva</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#222B45;--cy:#41D5FB;--bg:#EEF1F7;--mu:#5A6379;--li:#C9D1E0;--pa:#E3E8F2;--gr:#8A93A8;--red:#FB4A46;--n2:#3A4563;--z:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--navy);background:#D5DBE7;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,p{margin:0}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
input:focus-visible{outline-offset:-3px}
#app{height:100%;display:flex;flex-direction:column}

/* barra de demo */
.bar{flex:none;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:30}
.bar .logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:1px;font-size:18px}
.bar .tag{font-size:12px;font-weight:500;color:var(--li);border:1px solid var(--n2);border-radius:8px;padding:3px 8px;white-space:nowrap}
.seg{display:flex;background:var(--n2);border-radius:12px;padding:3px;gap:2px;margin:0 auto}
.seg button{height:34px;padding:0 14px;border-radius:10px;font-size:13px;font-weight:600;color:var(--li);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--cy);color:var(--navy)}
.gear{height:38px;padding:0 12px;border-radius:12px;background:var(--n2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.menu{position:absolute;right:12px;top:62px;width:310px;max-width:calc(100vw - 24px);background:#fff;color:var(--navy);border-radius:20px;padding:14px;box-shadow:0 18px 40px rgba(34,43,69,.35);display:flex;flex-direction:column;gap:12px}
.menu h2{font-size:15px;font-weight:700}
.menu .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.menu .opt small{display:block;color:var(--mu);font-size:12px;line-height:1.3}
.sw{flex:none;width:52px;height:30px;border-radius:15px;background:var(--li);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--navy)}
.sw[aria-checked=true]::after{transform:translateX(22px)}
.menu .mb{height:44px;border-radius:14px;background:var(--pa);font-weight:600;font-size:14px}

/* escenario */
.stage{flex:1;min-height:0;overflow:auto;position:relative}
.stage.ph{display:flex;align-items:center;justify-content:center;padding:16px}
.phone{width:390px;height:844px;zoom:var(--z);border-radius:36px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 30px 70px rgba(34,43,69,.35),0 0 0 8px var(--navy);flex:none}
.wide{min-height:100%;background:var(--bg)}
.wide>.in{max-width:1440px;margin:0 auto;padding:20px 32px 40px;display:flex;flex-direction:column;gap:20px}
@media (max-width:560px){
  .bar{height:48px;padding:0 8px;gap:6px}
  .bar .tag,.bar .logo span,.gear span{display:none}
  .seg button{padding:0 7px;height:32px;font-size:12px}
  .stage.ph{padding:0;display:block}
  .phone{width:100%;height:100%;zoom:1;border-radius:0;box-shadow:none}
  .wide>.in{padding:12px 12px 32px}
  .menu{top:54px;right:8px}
}

/* pantallas de celular */
.scr{display:flex;flex-direction:column;height:100%;background:var(--bg);position:relative;overflow:hidden}
.main{flex:1;min-height:0;overflow-y:auto;padding:24px 20px 20px;display:flex;flex-direction:column;gap:16px}
.hd{display:flex;align-items:center;gap:12px}
.bk{width:48px;height:48px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.h1{font-size:26px;font-weight:700;line-height:1.1}
.sub{font-size:14px;color:var(--mu)}
.sm{font-size:13px;line-height:1.4;color:var(--mu)}
.card{background:#fff;border-radius:24px;padding:16px}
.dark{background:var(--navy);color:#fff;border-radius:24px;padding:18px 20px;box-shadow:0 14px 28px rgba(34,43,69,.25)}
.dark .k{font-size:14px;color:var(--li)}
.big{font-size:34px;font-weight:700;line-height:1.1}
.col{display:flex;flex-direction:column}
.g2{gap:2px}.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}
.sb{display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot{flex:none;background:#fff;border-radius:28px 28px 0 0;padding:14px 20px 18px;box-shadow:0 -6px 24px rgba(34,43,69,.08);display:flex;gap:10px;align-items:center}
.btn{height:60px;border-radius:20px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;padding:0 22px;text-align:center}
.btn.f{flex:1}
.cy{background:var(--cy);color:var(--navy)}
.nv{background:var(--navy);color:#fff}
.pl{background:var(--pa);color:var(--navy)}
.wh{background:#fff;color:var(--navy)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{height:56px;border-radius:18px;font-weight:600;font-size:16px;background:#fff}
.pill[aria-pressed=true]{background:var(--navy);color:#fff}
.lbl{font-size:15px;font-weight:600}
.inp{height:58px;border:0;border-radius:18px;background:#fff;padding:0 16px;font:500 17px Lexend,system-ui,sans-serif;width:100%;min-width:0}
.inp.bad{box-shadow:inset 0 0 0 2px var(--red)}
.err{font-size:13px;font-weight:600;color:#B3211E}
.grid{display:grid;gap:8px}
.stepper{display:flex;align-items:center;background:#fff;border-radius:18px;height:60px;padding:0 6px}
.stepper button{width:48px;height:48px;border-radius:14px;font-size:26px;font-weight:600;flex:none}
.stepper input{flex:1;min-width:0;height:48px;border:0;background:transparent;text-align:center;font:700 24px Lexend,system-ui,sans-serif;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=range]{width:100%;height:32px;accent-color:var(--navy);margin:0}
.chip{background:var(--cy);border-radius:10px;padding:3px 8px;white-space:nowrap}
.tagp{border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-block}
.nav{flex:none;display:flex;background:#fff;border-radius:28px 28px 0 0;padding:8px 12px 12px;box-shadow:0 -6px 24px rgba(34,43,69,.06)}
.nav button{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--mu)}
.nav button span{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px}
.nav button[aria-current=page]{font-weight:700;color:var(--navy)}
.nav button[aria-current=page] span{background:var(--cy)}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:10px;padding:16px;min-height:136px;background:#fff;border-radius:24px}
.tile b{font-size:18px;font-weight:600}
.tile i{font-style:normal;font-size:13px;color:var(--mu)}
.tile.on{background:var(--navy);color:#fff;box-shadow:0 14px 28px rgba(34,43,69,.28)}
.tile.on i{color:var(--li)}
.rowl{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--bg);font-size:16px;width:100%;text-align:left}
.rowl:last-of-type{border-bottom:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bg)}
.item:last-child{border-bottom:0}
.status{background:var(--pa);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500}
.offl{display:flex;gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.35}
@keyframes biinPulse{0%,100%{opacity:1}50%{opacity:.55}}
.pulse{animation:biinPulse 1.4s ease-in-out infinite}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.note{position:absolute;left:10px;right:10px;top:10px;z-index:20;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 14px 32px rgba(34,43,69,.3);display:flex;gap:12px;align-items:center;text-align:left;animation:drop .3s ease-out;width:calc(100% - 20px)}
.note .ic{width:40px;height:40px;border-radius:12px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
.note b{font-size:13px;font-weight:600;color:var(--mu);display:block}
.note span{font-size:15px;font-weight:600;line-height:1.3}
.toast{position:absolute;left:16px;right:16px;bottom:104px;z-index:20;background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;font-weight:500;line-height:1.35;box-shadow:0 10px 24px rgba(34,43,69,.35);animation:fade .2s;text-align:center}
.wide~.toast,.toast.fx{position:fixed;left:50%;right:auto;bottom:28px;transform:translateX(-50%);max-width:min(480px,calc(100vw - 32px))}
.veil{position:absolute;inset:0;z-index:15;background:rgba(34,43,69,.45);display:flex;flex-direction:column;justify-content:flex-end;animation:fade .15s}
.veil.fx{position:fixed;justify-content:center;align-items:center;padding:16px;z-index:40}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto;animation:up .22s ease-out}
.veil.fx .sheet{border-radius:28px;width:440px;max-width:100%;max-height:100%;animation:fade .15s}
.sheet h2{font-size:22px;font-weight:700;line-height:1.15}
.radio{display:flex;align-items:center;gap:12px;min-height:56px;border-radius:18px;background:#fff;padding:0 16px;font-size:16px;font-weight:600;text-align:left;width:100%}
.radio::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid var(--gr);flex:none}
.radio[aria-pressed=true]::before{border:7px solid var(--navy)}
.paper{background:#fff;border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.paper table{width:100%;border-collapse:collapse}
.paper th{font-size:11px;font-weight:600;color:var(--mu);text-align:left;padding:6px 4px;border-bottom:2px solid var(--pa)}
.paper td{padding:7px 4px;border-bottom:1px solid var(--bg);vertical-align:top}
.paper .r{text-align:right;white-space:nowrap}

/* escritorio y operación */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:24px;padding:12px 20px}
.top .lg{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:1px}
.lgi{width:40px;height:40px;border-radius:13px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{height:44px;padding:0 20px;border-radius:14px;font-weight:600;font-size:15px}
.tabs button[aria-selected=true],.tabs button[aria-current=page]{background:var(--navy);color:#fff}
.panel{background:#fff;border-radius:28px;padding:20px 24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px}
.kpi{background:#fff;border-radius:24px;padding:20px}
.kpi .k{font-size:14px;color:var(--mu)}
.kpi .v{font-size:32px;font-weight:700}
.kpi.nv{background:var(--navy);color:#fff}
.kpi.cy{background:var(--cy)}
.kpi.nv .k{color:var(--li)}
.kpi.cy .k,.kpi.rd .k{color:var(--navy);font-weight:500}
.kpi.rd{background:var(--red)}
.tb{overflow-x:auto}
.tr{display:grid;gap:12px;align-items:center;padding:12px 0;font-size:15px;border-bottom:1px solid var(--bg)}
.tr.th{font-size:13px;font-weight:600;color:var(--mu);border-bottom:2px solid var(--pa);padding:10px 0}
.tr .r{text-align:right}
.sbtn{height:44px;padding:0 14px;border-radius:14px;background:var(--pa);font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center}
.sbtn.cy{background:var(--cy)}
.sbtn.nv{background:var(--navy);color:#fff}
.dinp{height:56px;border:0;border-radius:16px;background:var(--bg);padding:0 16px;font:700 22px Lexend,system-ui,sans-serif;min-width:0;width:100%}
.dpill{height:50px;border-radius:16px;font-weight:600;font-size:15px;background:var(--bg)}
.dpill[aria-pressed=true]{background:var(--navy);color:#fff}
.ai{height:46px;border:0;border-radius:14px;background:var(--bg);padding:0 12px;font:500 15px Lexend,system-ui,sans-serif;width:100%;min-width:0}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0;line-height:1.3}
.acat{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;text-align:left;flex:1;min-width:0}
.acat[aria-pressed=true]{background:var(--bg)}
.ib{width:36px;height:36px;border-radius:10px;background:var(--pa);font-weight:700;flex:none}
.ib[disabled]{opacity:.35;cursor:default}
.h3{font-size:18px;font-weight:700}
.icp{width:56px;height:56px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.icp[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--navy)}
.agrid{display:grid;gap:8px;align-items:center}
.ahd{font-size:12px;font-weight:600;color:var(--mu)}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{height:40px;padding:0 14px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:600}
.types button[aria-pressed=true]{background:var(--cy)}
</style>
</head>

/* ============ dibujos ============ */
function drawWall(W, Ht, big, L, H, m, nC, coat) {
  const k = big ? { px: 60, py: 50, base: 23, g: 20, cw: 8, jw: 1.5, min: 6, gw: 5 } : { px: 52, py: 28, base: 14, g: 12, cw: 5, jw: 1.2, min: 5, gw: 4 };
  const sc = Math.min((W - k.px) / L, (Ht - k.py) / H), dw = L * sc, dh = H * sc, dx = (W - dw) / 2, dy = Ht - k.base - dh;
  let s = '<rect x="' + dx + '" y="' + dy + '" width="' + dw + '" height="' + dh + '" fill="#E3E8F2"></rect>';
  if (m) {
    let uw = m.uw, uh = m.uh, j = '';
    while (uh * sc < k.min) { uw *= 2; uh *= 2; }
    const nr = Math.ceil(H / uh);
    for (let r = 0; r < nr; r++) {
      const yb = dy + dh - r * uh * sc, yt = Math.max(dy, yb - uh * sc);
      if (r > 0) j += 'M' + dx + ' ' + yb + 'H' + (dx + dw);
      for (let xx = (r % 2 ? uw / 2 : uw); xx < L; xx += uw) j += 'M' + (dx + xx * sc) + ' ' + yb + 'V' + yt;
    }
    s += '<path d="' + j + '" stroke="#fff" stroke-width="' + k.jw + '" fill="none"></path>';
  }
  if (coat) s += '<rect x="' + dx + '" y="' + dy + '" width="' + dw * 0.66 + '" height="' + dh + '" fill="#41D5FB" opacity="' + (m ? 0.78 : 1) + '"></rect>';
  if (nC) {
    const h2 = k.cw / 2;
    let c = 'M' + dx + ' ' + (dy + h2) + 'H' + (dx + dw);
    for (let i = 0; i < nC; i++) { const cx = dx + h2 + (dw - k.cw) * i / (nC - 1); c += 'M' + cx + ' ' + dy + 'V' + (dy + dh); }
    s += '<path d="' + c + '" stroke="#222B45" stroke-width="' + k.cw + '" fill="none"></path>';
  }
  return s + '<path d="M' + (big ? 20 : 16) + ' ' + (Ht - k.g) + 'H' + (W - (big ? 20 : 16)) + '" stroke="#41D5FB" stroke-width="' + k.gw + '" stroke-linecap="round" fill="none"></path>';
}
function drawPlan(W, Ht, big, L, A, step, kind) {
  const pad = big ? 30 : 16, sc = Math.min((W - 60) / L, (Ht - pad * 2) / A), dw = L * sc, dh = A * sc, dx = (W - dw) / 2, dy = (Ht - dh) / 2;
  let st = step, g = '';
  while (st * sc < (big ? 9 : 7)) st *= 2;
  for (let x = st; x < L - 1e-6; x += st) g += 'M' + (dx + x * sc) + ' ' + dy + 'V' + (dy + dh);
  for (let y = st; y < A - 1e-6; y += st) g += 'M' + dx + ' ' + (dy + y * sc) + 'H' + (dx + dw);
  let s = '<rect x="' + dx + '" y="' + dy + '" width="' + dw + '" height="' + dh + '" rx="' + (kind === 'room' ? 0 : 4) + '" fill="' + (kind === 'tile' ? '#41D5FB' : '#E3E8F2') + '"></rect>';
  if (kind === 'room') {
    const t = big ? 9 : 6;
    s += '<rect x="' + (dx + t / 2) + '" y="' + (dy + t / 2) + '" width="' + (dw - t) + '" height="' + (dh - t) + '" fill="#fff" stroke="#222B45" stroke-width="' + t + '"></rect>';
    s += '<path d="M' + (dx + dw * 0.35) + ' ' + (dy + dh - t / 2) + 'h' + Math.min(dw * 0.25, 0.9 * sc) + '" stroke="#41D5FB" stroke-width="' + t + '"></path>';
  } else {
    s += '<path d="' + g + '" stroke="' + (kind === 'rebar' ? '#222B45' : '#fff') + '" stroke-width="' + (kind === 'rebar' ? 1.1 : kind === 'tile' ? 2 : 1.2) + '" fill="none" opacity="' + (kind === 'rebar' ? 0.55 : 1) + '"></path>';
    if (kind !== 'tile') s += '<rect x="' + dx + '" y="' + dy + '" width="' + dw + '" height="' + dh + '" rx="4" fill="none" stroke="#41D5FB" stroke-width="' + (big ? 5 : 4) + '"></rect>';
  }
  return s;
}
function drawStrip(W, Ht, big, M, max, ground) {
  const frac = 0.3 + 0.7 * Math.min(1, M / max), len = (W - 60) * frac, x0 = (W - len) / 2, bh = big ? 56 : 40, y0 = (Ht - bh) / 2 - (ground ? 6 : 0);
  const n = Math.max(4, Math.round(len / (big ? 16 : 12)));
  let t = '';
  for (let i = 0; i <= n; i++) t += 'M' + (x0 + 4 + (len - 8) * i / n) + ' ' + (y0 + 6) + 'V' + (y0 + bh - 6);
  let s = '';
  if (ground) s += '<rect x="' + (x0 - 14) + '" y="' + (y0 + bh) + '" width="' + (len + 28) + '" height="' + (big ? 18 : 14) + '" rx="3" fill="#C9D1E0"></rect>';
  s += '<rect x="' + x0 + '" y="' + y0 + '" width="' + len + '" height="' + bh + '" rx="4" fill="#E3E8F2"></rect>';
  s += '<path d="' + t + '" stroke="#8A93A8" stroke-width="1.5" fill="none"></path>';
  s += '<path d="M' + x0 + ' ' + (y0 + 8) + 'H' + (x0 + len) + 'M' + x0 + ' ' + (y0 + bh - 8) + 'H' + (x0 + len) + '" stroke="#222B45" stroke-width="' + (big ? 4 : 3) + '" fill="none"></path>';
  if (ground) s += '<path d="M16 ' + (Ht - 10) + 'H' + (W - 16) + '" stroke="#41D5FB" stroke-width="4" stroke-linecap="round" fill="none"></path>';

}

function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType === 3) { if (a.data !== b.data) a.data = b.data; return; }
  if (a.nodeType !== 1) return;
  if (a.getAttribute('data-k') !== b.getAttribute('data-k')) { a.replaceWith(b); return; }
  const an = a.getAttributeNames(), bn = b.getAttributeNames();
  an.forEach((n) => { if (!b.hasAttribute(n)) a.removeAttribute(n); });
  bn.forEach((n) => { const v = b.getAttribute(n); if (a.getAttribute(n) !== v) a.setAttribute(n, v); });
  if (a.nodeName === 'INPUT' || a.nodeName === 'TEXTAREA') {
    const v = a.nodeName === 'INPUT' ? (b.getAttribute('value') || '') : b.textContent;
    if (!a.hasAttribute('data-keep') && document.activeElement !== a && a.value !== v) a.value = v;
    return;
  }
  const ac = Array.from(a.childNodes), bc = Array.from(b.childNodes);
  for (let i = 0; i < bc.length; i++) { if (i < ac.length) morph(ac[i], bc[i]); else a.appendChild(bc[i]); }
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
  if (a.nodeName === 'SELECT') { const v = b.getAttribute('data-v'); if (document.activeElement !== a && a.value !== v) a.value = v; }
}
function render() {

  t.innerHTML = view();
  morph(document.getElementById('app'), t.content.firstChild);

function later(ms, fn) { const g = gen; setTimeout(() => { if (g === gen) { fn(); render(); } }, ms); }

/* ============ lógica de crédito ============ */
function sendSol() {
  const f = S.fin, m = parseFloat(f.monto);
  const sol = { id: 's' + Date.now(), folio: 'BN-2026-00' + (S.nextSol++), cliente: f.form.nom || (S.user.email || 'Cliente +52 ' + S.user.cel), obra: f.src.obra || f.src.title, concept: f.src.concept, monto: r2(m), dias: f.dias, st: 'En revisión', fecha: addD(0), mine: true, rows: f.src.rows, dir: f.form.dir };
  S.sols.unshift(sol);
  f.solId = sol.id; f.step = 4; f.sending = false; S.pending = null;
  if (S.user && f.form.nom) { S.user.nombre = f.form.nom; if (sb) sb.from('profiles').update({ nombre: f.form.nom }).eq('id', S.user.id).then(() => {}); }
  if (S.auto) later(3800, () => { if (sol.st === 'En revisión') decide(sol, sol.monto <= disponible() + 0.005); });
  return sol;
}
function decide(sol, ok) {
  sol.st = ok ? 'Aprobada' : 'Rechazada';
  if (!sol.mine) return;
  if (!ok) { sol.why = sol.monto > disponible() + 0.005 ? 'El monto pasa de tu línea disponible (' + money(disponible()) + '). Intenta con un monto menor.' : ''; notify('BIIN', 'Tu solicitud ' + sol.folio + ' no fue aprobada. Abre la app para ver opciones.'); return; }
  S.creds.push(mkCred(sol.folio, sol.concept, sol.obra, sol.monto, sol.dias));
  S.hist.unshift({ t: 'Crédito para ' + sol.concept, sub: dShort(T0) + ' · ' + sol.obra, amt: sol.monto });
  const rows = sol.rows || [];
  rows.forEach((r) => { const i = S.inv.find((x) => x.key === r.key); if (i) i.apart = r2(i.apart + r.qty); });
  const names = [];
  rows.forEach((r) => { const s = CAT[r.key].s; if (names.indexOf(s) < 0) names.push(s); });
  const lst = (a) => cap(a.length > 1 ? a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1] : a[0] || 'material');
  const half = names.length > 2 ? Math.ceil(names.length / 2) : names.length;
  const parts = [names.slice(0, half)].concat(half < names.length ? [names.slice(half)] : []);
  parts.map((p, i) => [p, i]).reverse().forEach(([p, i]) => S.envios.unshift({ id: 'EN-' + (S.nextEnv++), obra: sol.obra, mat: lst(p), prov: 'Proveedor ' + 'AB'[i], date: addD(i ? 3 : 1), win: i ? '' : '8 a 12 h', st: 'Programado', mine: true }));
  notify('BIIN', 'Tu crédito ' + sol.folio + ' fue aprobado. Ya estamos programando tu material.');
}
